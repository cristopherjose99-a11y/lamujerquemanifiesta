# Regenera el sitio solo, en cuanto cambias productos.config.js desde GitHub.
# Así puedes añadir un producto desde el navegador, sin abrir la terminal.

name: Generar el sitio

on:
  push:
    branches: [main]
    paths:
      - 'productos.config.js'
      - 'build.js'
      - 'plantillas/**'
  workflow_dispatch:        # también se puede lanzar a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar las páginas
        run: node build.js

      - name: Publicar lo generado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Regenera el sitio desde productos.config.js"
            git push
            echo "Sitio actualizado."
          else
            echo "No había cambios que publicar."
          fi
